<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAN Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light;
      --bg: #ffffff;
      --sidebar: #ffffff;
      --hover: #f2f3f5;
      --active: #e7f3ff;
      --text: #050505;
      --muted: #65676b;
      --border: #e4e6eb;
      --input: #f0f2f5;
      --other: #e9ebee;
      --other-text: #050505;
      --blue: #0084ff;
      --me-bg: linear-gradient(135deg, #0aa0ff, #0070ff);
      --shadow: 0 8px 28px rgba(0, 0, 0, .18);
      --green: #31a24c;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #18191a;
      --sidebar: #242526;
      --hover: #3a3b3c;
      --active: #263951;
      --text: #e4e6eb;
      --muted: #b0b3b8;
      --border: #3e4042;
      --input: #3a3b3c;
      --other: #3a3b3c;
      --other-text: #e4e6eb;
      --shadow: 0 8px 28px rgba(0, 0, 0, .6);
    }

    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

    .app { display: flex; height: 100%; }

    /* ---------- Avatars ---------- */
    .avatar {
      position: relative;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 17px;
      flex-shrink: 0;
      user-select: none;
    }
    .avatar.sm { width: 28px; height: 28px; font-size: 12px; }
    .avatar.lg { width: 52px; height: 52px; font-size: 20px; }
    .avatar .badge {
      position: absolute; right: -1px; bottom: -1px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--green);
      border: 2.5px solid var(--sidebar);
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 360px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .side-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 16px 8px;
    }
    .side-head h2 { font-size: 24px; font-weight: 800; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--input);
      font-size: 17px;
    }
    .icon-btn:hover { background: var(--hover); filter: brightness(.96); }

    .search { padding: 8px 16px 10px; }
    .search input {
      width: 100%; border: none; outline: none;
      background: var(--input); color: var(--text);
      padding: 10px 16px; border-radius: 22px; font-size: 15px;
    }
    .search input::placeholder { color: var(--muted); }

    .conv {
      display: flex; align-items: center; gap: 12px;
      margin: 0 8px; padding: 10px 8px;
      border-radius: 10px;
    }
    .conv.active { background: var(--active); }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-weight: 600; font-size: 15px; }
    .conv-preview {
      font-size: 13px; color: var(--muted);
      display: flex; gap: 6px;
    }
    .conv-preview .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-preview .when { flex-shrink: 0; }

    .section-title {
      padding: 16px 16px 6px; font-size: 14px; font-weight: 600; color: var(--muted);
    }
    .people { list-style: none; overflow-y: auto; padding: 0 8px; flex: 1; }
    .person {
      display: flex; align-items: center; gap: 12px;
      padding: 8px; border-radius: 10px;
    }
    .person:hover { background: var(--hover); }
    .person .pname { font-size: 15px; font-weight: 500; }
    .person .you { color: var(--muted); font-weight: 400; }
    .no-people { padding: 8px 16px; color: var(--muted); font-size: 14px; }

    /* ---------- Chat panel ---------- */
    .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

    .chat-head {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    }
    .chat-head .who { flex: 1; min-width: 0; }
    .chat-head .who b { display: block; font-size: 16px; }
    .status { font-size: 12.5px; color: var(--muted); }
    .status.ok::before, .status.bad::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: 0;
    }
    .status.ok::before { background: var(--green); }
    .status.bad::before { background: #e41e3f; }
    .me-btn { padding: 0; border-radius: 50%; }

    .messages {
      flex: 1; overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex; flex-direction: column;
      scrollbar-width: thin;
    }
    .intro {
      margin: auto; text-align: center; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .intro b { color: var(--text); font-size: 18px; }

    .divider {
      text-align: center; font-size: 12px; color: var(--muted);
      margin: 14px 0 8px;
    }

    .msg { display: flex; align-items: flex-end; gap: 8px; margin-top: 2px; }
    .msg.first { margin-top: 10px; }
    .msg.me { justify-content: flex-end; }
    .col { display: flex; flex-direction: column; max-width: min(65%, 520px); }
    .msg.me .col { align-items: flex-end; }
    .sender { font-size: 12px; color: var(--muted); margin: 0 0 2px 12px; }
    .spacer { width: 28px; flex-shrink: 0; }

    .bubble {
      padding: 8px 12px;
      font-size: 15px; line-height: 1.33;
      white-space: pre-wrap; overflow-wrap: anywhere;
      border-radius: 18px;
    }
    .msg.other .bubble { background: var(--other); color: var(--other-text); border-radius: 4px 18px 18px 4px; }
    .msg.me .bubble { background: var(--me-bg); background-attachment: fixed; color: #fff; border-radius: 18px 4px 4px 18px; }
    .msg.other.first .bubble { border-top-left-radius: 18px; }
    .msg.other.last .bubble { border-bottom-left-radius: 18px; }
    .msg.me.first .bubble { border-top-right-radius: 18px; }
    .msg.me.last .bubble { border-bottom-right-radius: 18px; }
    .bubble.big { background: none !important; padding: 0 4px; font-size: 38px; line-height: 1.2; }

    /* typing */
    .typing {
      display: flex; align-items: center; gap: 8px;
      padding: 0 16px; height: 26px; font-size: 12.5px; color: var(--muted);
    }
    .typing.hidden { visibility: hidden; }
    .dots { display: inline-flex; gap: 3px; background: var(--other); padding: 7px 9px; border-radius: 12px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

    /* ---------- Composer ---------- */
    .composer { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 16px 14px; }
    .tool {
      width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center; font-size: 22px; color: var(--blue);
      flex-shrink: 0;
    }
    .tool:hover { background: var(--hover); }
    .tool svg { width: 22px; height: 22px; fill: currentColor; }
    .composer input {
      flex: 1; min-width: 0; border: none; outline: none;
      background: var(--input); color: var(--text);
      padding: 10px 16px; border-radius: 22px; font-size: 15px;
    }
    .composer input::placeholder { color: var(--muted); }
    #sendBtn { display: none; }
    .composer.has-text #sendBtn { display: grid; }
    .composer.has-text #likeBtn { display: none; }

    .emoji-pop {
      position: absolute; left: 12px; bottom: 62px;
      width: 272px; padding: 8px;
      background: var(--sidebar); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: var(--shadow);
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
      z-index: 5;
    }
    .emoji-pop.hidden { display: none; }
    .emoji-pop button { font-size: 22px; padding: 4px; border-radius: 8px; }
    .emoji-pop button:hover { background: var(--hover); }

    /* ---------- Name modal ---------- */
    .modal {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0, 0, 0, .55);
      display: grid; place-items: center;
    }
    .modal.hidden { display: none; }
    .modal-box {
      background: var(--sidebar); color: var(--text);
      padding: 26px; border-radius: 16px; box-shadow: var(--shadow);
      width: min(380px, 90vw);
      display: flex; flex-direction: column; gap: 12px; text-align: center;
    }
    .modal-box p { color: var(--muted); font-size: 14px; }
    .modal-box input {
      border: 1px solid var(--border); background: var(--input); color: var(--text);
      padding: 12px 14px; border-radius: 10px; font-size: 16px; outline: none; text-align: center;
    }
    .modal-box input:focus { border-color: var(--blue); }
    .modal-box .primary {
      background: var(--blue); color: #fff; font-weight: 600;
      padding: 12px; border-radius: 10px; font-size: 15px;
    }
    .modal-box .primary:hover { filter: brightness(1.08); }

    /* ---------- Responsive ---------- */
    @media (max-width: 820px) {
      .sidebar { display: none; }
      .col { max-width: 78%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="side-head">
        <h2>Chats</h2>
        <button class="icon-btn" id="themeBtn" title="Dark / light mode">🌙</button>
      </div>
      <div class="search"><input id="search" type="search" placeholder="Search in chat" /></div>

      <div class="conv active">
        <div class="avatar" id="convAvatar" style="background:linear-gradient(135deg,#0aa0ff,#a033ff)">💬</div>
        <div class="conv-info">
          <div class="conv-name">LAN Chat</div>
          <div class="conv-preview"><span class="txt" id="convPreview">No messages yet</span><span class="when" id="convWhen"></span></div>
        </div>
      </div>

      <div class="section-title">Active now</div>
      <ul class="people" id="people"></ul>
    </aside>

    <!-- Chat -->
    <section class="chat">
      <header class="chat-head">
        <div class="avatar" style="background:linear-gradient(135deg,#0aa0ff,#a033ff)">💬</div>
        <div class="who">
          <b>LAN Chat</b>
          <span id="status" class="status bad">Connecting…</span>
        </div>
        <button class="icon-btn" id="themeBtn2" title="Dark / light mode">🌙</button>
        <button class="me-btn" id="meBtn" title="Change name"><div class="avatar sm" id="myAvatar">?</div></button>
      </header>

      <main class="messages" id="messages" aria-live="polite"></main>

      <div class="typing hidden" id="typing"><span class="dots"><i></i><i></i><i></i></span><span id="typingText"></span></div>

      <form class="composer" id="form" autocomplete="off">
        <button type="button" class="tool" id="emojiBtn" title="Emoji">😊</button>
        <input id="input" type="text" placeholder="Aa" maxlength="2000" />
        <button type="submit" class="tool" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2.4 20.6 22 12 2.4 3.4 2.4 10l14 2-14 2z"/></svg>
        </button>
        <button type="button" class="tool" id="likeBtn" title="Send a like">👍</button>
        <div class="emoji-pop hidden" id="emojiPop"></div>
      </form>
    </section>
  </div>

  <!-- Name dialog -->
  <div id="nameModal" class="modal hidden">
    <form id="nameForm" class="modal-box">
      <h2>Welcome 👋</h2>
      <p>Enter your name (for example PC1 or PC2)</p>
      <input id="nameInput" type="text" maxlength="30" placeholder="Your name" required />
      <button type="submit" class="primary">Start chatting</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
