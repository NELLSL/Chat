<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAN Chat</title>
  <!-- Optional web font; the page still works (with system fonts) when offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      color-scheme: light;
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface-2: #f0f4f9;
      --primary: #0b57d0;
      --on-primary: #ffffff;
      --primary-c: #d3e3fd;
      --on-primary-c: #041e49;
      --text: #1f1f1f;
      --muted: #444746;
      --outline: #dadce0;
      --hover: rgba(31, 31, 31, .08);
      --green: #188038;
      --elev1: 0 1px 2px rgba(60, 64, 67, .3), 0 1px 3px 1px rgba(60, 64, 67, .15);
      --elev2: 0 1px 3px rgba(60, 64, 67, .3), 0 4px 8px 3px rgba(60, 64, 67, .15);
      --ease: cubic-bezier(.2, 0, 0, 1);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #131314;
      --surface: #1e1f20;
      --surface-2: #282a2c;
      --primary: #a8c7fa;
      --on-primary: #062e6f;
      --primary-c: #0842a0;
      --on-primary-c: #d3e3fd;
      --text: #e3e3e3;
      --muted: #c4c7c5;
      --outline: #444746;
      --hover: rgba(227, 227, 227, .1);
      --green: #81c995;
      --elev1: 0 1px 2px rgba(0, 0, 0, .6), 0 1px 3px 1px rgba(0, 0, 0, .4);
      --elev2: 0 1px 3px rgba(0, 0, 0, .6), 0 4px 8px 3px rgba(0, 0, 0, .4);
    }

    html, body { height: 100%; }
    body {
      font-family: "Google Sans", "Product Sans", Roboto, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      animation: fadein .5s var(--ease);
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    .ic { width: 24px; height: 24px; fill: currentColor; display: block; }

    .app { display: flex; flex-direction: column; height: 100%; }

    /* ---------- Ripple + state layer (Material) ---------- */
    .ripple { position: relative; overflow: hidden; }
    .ripple::after {              /* hover state layer */
      content: ""; position: absolute; inset: 0; background: currentColor;
      opacity: 0; transition: opacity .15s; pointer-events: none; border-radius: inherit;
    }
    .ripple:hover::after { opacity: .06; }
    .ripple:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .rip {
      position: absolute; border-radius: 50%; background: currentColor; opacity: .18;
      transform: scale(0); animation: rip .6s var(--ease) forwards; pointer-events: none;
    }
    @keyframes rip { to { transform: scale(1); opacity: 0; } }

    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; color: var(--muted); flex-shrink: 0;
    }

    /* ---------- Top app bar ---------- */
    .topbar {
      height: 64px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 0 16px 0 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; width: 220px; flex-shrink: 0; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 10px; color: #fff;
      background: linear-gradient(135deg, #4285f4, #34a853);
      display: grid; place-items: center;
    }
    .brand .logo .ic { width: 22px; height: 22px; }
    .brand span { font-size: 22px; color: var(--muted); letter-spacing: -.2px; }

    .search {
      flex: 1; max-width: 720px; height: 46px;
      display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px;
      background: var(--surface-2); border-radius: 24px; color: var(--muted);
      transition: background .2s, box-shadow .2s;
    }
    .search:focus-within { background: var(--surface); box-shadow: var(--elev2); color: var(--text); }
    .search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      color: var(--text); font: inherit; font-size: 16px;
    }
    .search input::placeholder { color: var(--muted); }
    .grow { flex: 1; }
    .me-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }

    /* ---------- Avatars ---------- */
    .avatar {
      position: relative; flex-shrink: 0;
      width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center;
      color: #fff; font-weight: 500; font-size: 16px; user-select: none;
    }
    .avatar.sm { width: 28px; height: 28px; font-size: 13px; }
    .avatar.lg { width: 64px; height: 64px; font-size: 26px; }
    .avatar .badge {
      position: absolute; right: -2px; bottom: -2px;
      width: 13px; height: 13px; border-radius: 50%;
      background: #34a853; border: 2px solid var(--bg);
    }
    .avatar.group { background: var(--primary-c); color: var(--on-primary-c); }
    .avatar.group .ic { width: 55%; height: 55%; }
    .conv.active .avatar.group { background: var(--surface); }

    /* ---------- Layout ---------- */
    .body { flex: 1; min-height: 0; display: flex; padding: 0 16px 16px 0; position: relative; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 272px; flex-shrink: 0; overflow: hidden;
      transition: width .28s var(--ease), opacity .2s;
    }
    .app:not(.nav-open) .sidebar { width: 0; opacity: 0; pointer-events: none; }
    .side-inner { width: 272px; height: 100%; display: flex; flex-direction: column; padding-left: 12px; }

    .conv {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 28px; margin-right: 8px;
    }
    .conv.active { background: var(--primary-c); color: var(--on-primary-c); }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-weight: 500; font-size: 15px; }
    .conv-preview { font-size: 13px; opacity: .8; display: flex; gap: 6px; }
    .conv-preview .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-preview .when { flex-shrink: 0; }

    .section-title { padding: 20px 16px 8px; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .3px; }
    .people { list-style: none; overflow-y: auto; margin-right: 8px; flex: 1; }
    .person { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 28px; }
    .person .pname { font-size: 15px; }
    .person .you { color: var(--muted); }
    .no-people { padding: 8px 16px; color: var(--muted); font-size: 14px; }

    .scrim {
      position: fixed; inset: 0; background: rgba(0, 0, 0, .35);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 25;
    }

    /* ---------- Chat card ---------- */
    .chat {
      flex: 1; min-width: 0; position: relative;
      background: var(--surface); border-radius: 18px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .progress { position: absolute; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; opacity: 0; transition: opacity .3s; z-index: 3; }
    .progress.on { opacity: 1; }
    .progress::before {
      content: ""; position: absolute; top: 0; bottom: 0; width: 40%;
      background: linear-gradient(90deg, #4285f4 0 25%, #ea4335 25% 50%, #fbbc04 50% 75%, #34a853 75%);
      animation: slide 1.3s var(--ease) infinite;
    }
    @keyframes slide { from { left: -40%; } to { left: 100%; } }

    .chat-head {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-bottom: 1px solid var(--outline);
    }
    .chat-head .who { flex: 1; min-width: 0; }
    .chat-head .who b { display: block; font-size: 17px; font-weight: 500; }
    .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); transition: background .3s; }
    .status.bad::before { background: #d93025; }

    .messages {
      flex: 1; overflow-y: auto; padding: 16px 20px 8px;
      display: flex; flex-direction: column; scrollbar-width: thin;
    }
    .intro {
      margin: auto; text-align: center; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .intro b { color: var(--text); font-size: 20px; font-weight: 500; }
    .divider { text-align: center; font-size: 12px; color: var(--muted); margin: 16px 0 6px; }

    .msg { display: flex; align-items: flex-end; gap: 8px; margin-top: 2px; }
    .msg.first { margin-top: 10px; }
    .msg.me { justify-content: flex-end; }
    .col { display: flex; flex-direction: column; max-width: min(68%, 560px); }
    .msg.me .col { align-items: flex-end; }
    .sender { font-size: 12px; color: var(--muted); margin: 0 0 3px 14px; }
    .time { font-size: 11px; color: var(--muted); margin: 3px 8px 0; }
    .spacer { width: 28px; flex-shrink: 0; }

    .bubble {
      padding: 9px 14px; font-size: 15px; line-height: 1.4;
      white-space: pre-wrap; overflow-wrap: anywhere;
      border-radius: 20px;
      transition: box-shadow .2s;
    }
    .bubble:hover { box-shadow: var(--elev1); }
    .msg.other .bubble { background: var(--surface-2); color: var(--text); border-radius: 6px 20px 20px 6px; }
    .msg.me .bubble { background: var(--primary-c); color: var(--on-primary-c); border-radius: 20px 6px 6px 20px; }
    .msg.other.first .bubble { border-top-left-radius: 20px; }
    .msg.other.last .bubble { border-bottom-left-radius: 20px; }
    .msg.me.first .bubble { border-top-right-radius: 20px; }
    .msg.me.last .bubble { border-bottom-right-radius: 20px; }
    .bubble.big { background: none !important; box-shadow: none !important; padding: 0 4px; font-size: 40px; line-height: 1.2; }

    .pop .bubble { animation: pop .28s var(--ease); }
    .msg.me.pop .bubble { transform-origin: bottom right; }
    .msg.other.pop .bubble { transform-origin: bottom left; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.9); } to { opacity: 1; transform: none; } }

    /* typing */
    .typing { display: flex; align-items: center; gap: 8px; padding: 0 20px; height: 28px; font-size: 13px; color: var(--muted); transition: opacity .2s; }
    .typing.hidden { opacity: 0; }
    .dots { display: inline-flex; gap: 3px; background: var(--surface-2); padding: 8px 10px; border-radius: 14px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

    /* ---------- Composer ---------- */
    .composer { position: relative; padding: 4px 16px 16px; }
    .field {
      display: flex; align-items: center; gap: 2px;
      background: var(--surface-2); border: 1px solid transparent;
      border-radius: 28px; padding: 4px 6px;
      transition: background .2s, border-color .2s, box-shadow .2s;
    }
    .field:focus-within { background: var(--surface); border-color: var(--primary); box-shadow: var(--elev1); }
    .field input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      color: var(--text); font: inherit; font-size: 15px; padding: 10px 8px;
    }
    .field input::placeholder { color: var(--muted); }
    .tool { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex-shrink: 0; }
    #likeBtn { color: var(--primary); }
    #sendBtn { display: none; background: var(--primary); color: var(--on-primary); box-shadow: var(--elev1); transition: box-shadow .2s; }
    #sendBtn:hover { box-shadow: var(--elev2); }
    .composer.has-text #sendBtn { display: grid; animation: popin .2s var(--ease); }
    .composer.has-text #likeBtn { display: none; }
    @keyframes popin { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

    .emoji-pop {
      position: absolute; left: 16px; bottom: 80px; width: 292px; padding: 10px;
      background: var(--surface); border: 1px solid var(--outline);
      border-radius: 16px; box-shadow: var(--elev2);
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; z-index: 5;
      transform-origin: bottom left; animation: scalein .18s var(--ease);
    }
    .emoji-pop.hidden { display: none; }
    .emoji-pop button { font-size: 22px; padding: 5px; border-radius: 10px; transition: transform .12s, background .12s; }
    .emoji-pop button:hover { background: var(--hover); transform: scale(1.2); }
    @keyframes scalein { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }

    /* ---------- Snackbar ---------- */
    .snack {
      position: fixed; left: 24px; bottom: 24px; z-index: 40;
      min-width: 288px; max-width: calc(100vw - 48px);
      background: #303030; color: #f1f1f1;
      padding: 14px 16px; border-radius: 6px; font-size: 14px; box-shadow: var(--elev2);
      transform: translateY(24px); opacity: 0; pointer-events: none;
      transition: transform .25s var(--ease), opacity .25s;
    }
    .snack.show { transform: none; opacity: 1; }

    /* ---------- Name dialog ---------- */
    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .4); display: grid; place-items: center; animation: fadein .2s; }
    .modal.hidden { display: none; }
    .modal-box {
      background: var(--surface); color: var(--text);
      width: min(400px, 92vw); padding: 28px 24px 20px; border-radius: 28px;
      box-shadow: var(--elev2); display: flex; flex-direction: column; gap: 14px;
      animation: scalein .25s var(--ease);
    }
    .modal-box h2 { font-size: 24px; font-weight: 400; }
    .modal-box p { color: var(--muted); font-size: 14px; }
    .modal-box input {
      border: 1px solid var(--outline); background: transparent; color: var(--text);
      padding: 14px 16px; border-radius: 6px; font: inherit; font-size: 16px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .modal-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .modal-box .actions { display: flex; justify-content: flex-end; padding-top: 6px; }
    .btn {
      background: var(--primary); color: var(--on-primary); font-weight: 500; font-size: 14px;
      padding: 10px 24px; border-radius: 20px; letter-spacing: .2px;
    }
    .btn:hover { box-shadow: var(--elev1); }

    /* ---------- Mobile ---------- */
    @media (max-width: 820px) {
      .brand { width: auto; }
      .brand span { display: none; }
      .body { padding: 0; }
      .chat { border-radius: 0; }
      .col { max-width: 80%; }
      .sidebar, .app:not(.nav-open) .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; width: 288px; opacity: 1; pointer-events: auto;
        background: var(--surface); z-index: 30; padding-top: 12px;
        transform: translateX(-102%); transition: transform .28s var(--ease);
        box-shadow: var(--elev2);
      }
      .app.nav-open .sidebar { transform: none; }
      .app.nav-open .scrim { opacity: 1; pointer-events: auto; }
      .side-inner { width: 100%; }
      .snack { left: 8px; right: 8px; bottom: 8px; max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div class="app nav-open" id="app">
    <!-- Top app bar -->
    <header class="topbar">
      <button class="icon-btn ripple" id="navBtn" title="Main menu" aria-label="Main menu">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="brand">
        <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
        <span>LAN Chat</span>
      </div>
      <label class="search">
        <svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search" type="search" placeholder="Search in chat" autocomplete="off" />
      </label>
      <div class="grow"></div>
      <button class="icon-btn ripple" id="themeBtn" title="Dark / light mode" aria-label="Toggle theme"></button>
      <button class="me-btn ripple" id="meBtn" title="Change name" aria-label="Change name"><div class="avatar sm" id="myAvatar">?</div></button>
    </header>

    <div class="body">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="side-inner">
          <div class="conv active ripple">
            <div class="avatar group"><svg class="ic" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
            <div class="conv-info">
              <div class="conv-name">LAN Chat</div>
              <div class="conv-preview"><span class="txt" id="convPreview">No messages yet</span><span class="when" id="convWhen"></span></div>
            </div>
          </div>
          <div class="section-title">Active now</div>
          <ul class="people" id="people"></ul>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <!-- Chat -->
      <section class="chat">
        <div class="progress on" id="progress"></div>
        <header class="chat-head">
          <div class="avatar group"><svg class="ic" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
          <div class="who">
            <b>LAN Chat</b>
            <span id="status" class="status bad">Connecting…</span>
          </div>
        </header>

        <main class="messages" id="messages" aria-live="polite"></main>

        <div class="typing hidden" id="typing"><span class="dots"><i></i><i></i><i></i></span><span id="typingText"></span></div>

        <form class="composer" id="form" autocomplete="off">
          <div class="field">
            <button type="button" class="tool ripple" id="emojiBtn" title="Emoji" aria-label="Emoji">
              <svg class="ic" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
            </button>
            <input id="input" type="text" placeholder="Type a message" maxlength="2000" />
            <button type="button" class="tool ripple" id="likeBtn" title="Send a like" aria-label="Send a like">
              <svg class="ic" viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            </button>
            <button type="submit" class="tool ripple" id="sendBtn" title="Send" aria-label="Send">
              <svg class="ic" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
          <div class="emoji-pop hidden" id="emojiPop"></div>
        </form>
      </section>
    </div>
  </div>

  <div class="snack" id="snack" role="status"></div>

  <!-- Name dialog -->
  <div id="nameModal" class="modal hidden">
    <form id="nameForm" class="modal-box">
      <h2>Welcome</h2>
      <p>Enter your name (for example PC1 or PC2)</p>
      <input id="nameInput" type="text" maxlength="30" placeholder="Your name" required />
      <div class="actions"><button type="submit" class="btn ripple">Start chatting</button></div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
