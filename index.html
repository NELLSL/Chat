<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAN Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0084ff;
      --blue-dark: #006fd6;
      --bg: #f0f2f5;
      --bubble-other: #e4e6eb;
      --text: #050505;
      --muted: #65676b;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      max-height: 900px;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
      border-radius: 12px;
      overflow: hidden;
    }

    @media (max-width: 720px) {
      .app { max-height: none; border-radius: 0; }
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #e4e6eb;
      background: #fff;
    }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0084ff, #a033ff);
      color: #fff;
      display: grid; place-items: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.small { width: 28px; height: 28px; font-size: 12px; background: #8a8d91; }

    .title { flex: 1; min-width: 0; }
    .title h1 { font-size: 17px; }
    .status { font-size: 12px; }
    .status.online { color: #31a24c; }
    .status.offline { color: #e41e3f; }

    .online {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--muted);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #31a24c; }

    .ghost {
      background: transparent;
      border: 1px solid #ccd0d5;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .ghost:hover { background: var(--bg); }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #fff;
    }

    .empty {
      margin: auto;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .row { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
    .row.me { justify-content: flex-end; }
    .row.first { margin-top: 10px; }

    .bubble-wrap { display: flex; flex-direction: column; max-width: 70%; }
    .row.me .bubble-wrap { align-items: flex-end; }

    .sender { font-size: 11px; color: var(--muted); margin: 0 12px 2px; }

    .bubble {
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .row.other .bubble { background: var(--bubble-other); border-bottom-left-radius: 4px; }
    .row.me .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }

    .time { font-size: 10px; color: var(--muted); margin: 2px 12px 0; }

    .spacer { width: 28px; flex-shrink: 0; }

    /* Composer */
    .composer {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid #e4e6eb;
      background: #fff;
    }
    .composer input {
      flex: 1;
      border: none;
      background: var(--bg);
      padding: 11px 16px;
      border-radius: 22px;
      font-size: 15px;
      outline: none;
    }
    .composer input:focus { box-shadow: 0 0 0 2px rgba(0, 132, 255, .35); }
    .composer button, .modal-box button {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 0 22px;
      border-radius: 22px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .composer button:hover, .modal-box button:hover { background: var(--blue-dark); }
    .composer button:disabled { background: #b8c1cc; cursor: not-allowed; }

    /* Modal */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, .5);
      display: grid; place-items: center;
      z-index: 10;
    }
    .modal.hidden { display: none; }
    .modal-box {
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      width: min(360px, 90vw);
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-box p { color: var(--muted); font-size: 14px; }
    .modal-box input {
      border: 1px solid #ccd0d5;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .modal-box input:focus { border-color: var(--blue); }
    .modal-box button { padding: 11px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="avatar" id="myAvatar">?</div>
      <div class="title">
        <h1>LAN Messenger</h1>
        <span id="status" class="status offline">Connecting…</span>
      </div>
      <div class="online"><span class="dot"></span><span id="onlineCount">0</span> online</div>
      <button id="changeName" class="ghost" title="Change name">Change name</button>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <form id="form" class="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Type a message…" maxlength="2000" />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <!-- Name dialog -->
  <div id="nameModal" class="modal hidden">
    <form id="nameForm" class="modal-box">
      <h2>Welcome 👋</h2>
      <p>Enter your name (e.g. PC1 or PC2)</p>
      <input id="nameInput" type="text" maxlength="30" placeholder="Your name" required />
      <button type="submit">Start chatting</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
